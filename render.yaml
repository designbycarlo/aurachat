# Render deploy config (free tier).
# Single-platform free setup: Render hosts both the Node web service and the
# Postgres database. Render auto-injects DATABASE_URL into the web service from
# the database below — no manual copy/paste needed.
#
# The app uses standard `pg` against DATABASE_URL and has no host-specific
# code, so this is the only infra file needed.
#
# Deploy: push this repo to GitHub, then Render -> New -> Blueprints ->
# connect the repo. Render reads this file and provisions both services.
#
# Required env var (set in Render dashboard, not here):
#   OPENROUTER_API_KEY = your OpenRouter key (free at https://openrouter.ai/keys)
# DATABASE_URL is provided automatically by the database below.

databases:
  - name: aurachat-db
    plan: free
    databaseName: aurachat
    postgresMajorVersion: "16"   # free tier supports current major versions

services:
  - type: web
    name: aurachat
    runtime: node
    plan: free
    buildCommand: npm install
    # Run migrations once before the server starts (throwaway process, exits).
    preDeployCommand: node migrate.js
    startCommand: npm start
    healthCheckPath: /health
    # Render sets NODE_ENV=production and PORT automatically, and links
    # DATABASE_URL from the database above.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aurachat-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
