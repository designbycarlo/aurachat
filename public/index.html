<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraChat AI SEO</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #4ade80;
      --warn: #facc15;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 800px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
    }
    form {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    input[type="url"] {
      flex: 1;
      min-width: 240px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    input[type="url"]:focus {
      border-color: var(--accent);
    }
    button {
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .result {
      margin-top: 24px;
      display: none;
    }
    .result.visible {
      display: block;
    }
    .score-row {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .score {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      color: #0f172a;
    }
    .grade {
      font-size: 22px;
      font-weight: 700;
    }
    .summary {
      color: var(--muted);
      margin-top: 4px;
    }
    .lists {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .list {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
    }
    .list h3 {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .list ul {
      margin: 0;
      padding-left: 18px;
    }
    .list li {
      margin-bottom: 8px;
      line-height: 1.45;
    }
    .strengths li { color: #bbf7d0; }
    .weaknesses li { color: #fecaca; }
    .recommendations li { color: #e2e8f0; }
    .error {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(248,113,113,0.15);
      color: var(--danger);
      display: none;
    }
    .loading {
      margin-top: 16px;
      color: var(--muted);
      display: none;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--muted);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .loading-text {
      display: inline-block;
      animation: fadeIn 0.4s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>AI SEO / AEO Analyzer</h1>
      <p class="subtitle">Get a personalized report on how optimized your site is for AI-driven discovery.</p>
      <form id="analyzeForm">
        <input type="url" id="urlInput" placeholder="https://example.com" required />
        <button type="submit" id="submitBtn">Analyze</button>
      </form>
      <div class="loading" id="loading">
        <span class="spinner"></span><span class="loading-text" id="loadingText">Analyzing your page...</span>
      </div>
      <div class="error" id="error"></div>
      <div class="result" id="result">
        <div class="score-row">
          <div class="score" id="scoreCircle">--</div>
          <div>
            <div class="grade" id="gradeText">--</div>
            <div class="summary" id="summaryText"></div>
          </div>
        </div>
        <div class="lists">
          <div class="list strengths">
            <h3>Strengths</h3>
            <ul id="strengthsList"></ul>
          </div>
          <div class="list weaknesses">
            <h3>Weaknesses</h3>
            <ul id="weaknessesList"></ul>
          </div>
          <div class="list recommendations">
            <h3>Recommendations</h3>
            <ul id="recommendationsList"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const form = document.getElementById('analyzeForm');
    const urlInput = document.getElementById('urlInput');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const errorEl = document.getElementById('error');
    const result = document.getElementById('result');

    const FUN_LOADING_TEXTS = [
      'Analyzing your page...',
      'Scanning meta tags for secrets...',
      'Counting headings like a librarian...',
      'Hunting for structured data...',
      'Checking if AI can find you...',
      'Measuring your AEO readiness...',
      'Asking the AI gods for wisdom...',
      'Decoding your Open Graph...',
      'Looking for FAQ gold...',
      'Evaluating conversational vibes...',
      'Searching for schema.org treasures...',
      'Polishing the crystal ball...',
      'Consulting the SEO oracle...',
      'Reading between the lines of your HTML...',
      'Checking if ChatGPT would recommend you...',
      'Seeing how Perplexity perceives you...',
      'Whispering to the search algorithms...',
      'Inspecting your JSON-LD for magic...',
      'Counting words like they matter...',
      'Gauging your AI-friendliness index...',
    ];

    let loadingInterval = null;
    let loadingIndex = 0;

    function startLoadingText() {
      loadingIndex = 0;
      loadingText.textContent = FUN_LOADING_TEXTS[0];
      loadingInterval = setInterval(() => {
        loadingIndex = (loadingIndex + 1) % FUN_LOADING_TEXTS.length;
        loadingText.textContent = FUN_LOADING_TEXTS[loadingIndex];
        // Restart the fade animation
        loadingText.classList.remove('loading-text');
        void loadingText.offsetWidth;
        loadingText.classList.add('loading-text');
      }, 2200);
    }

    function stopLoadingText() {
      if (loadingInterval) {
        clearInterval(loadingInterval);
        loadingInterval = null;
      }
    }

    function gradeColor(score) {
      if (score >= 85) return 'var(--success)';
      if (score >= 70) return '#38bdf8';
      if (score >= 55) return 'var(--warn)';
      if (score >= 40) return '#fb923c';
      return 'var(--danger)';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();
      if (!url) return;
      submitBtn.disabled = true;
      loading.style.display = 'block';
      startLoadingText();
      errorEl.style.display = 'none';
      result.classList.remove('visible');
      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        if (data.error) throw new Error(data.error);
        const score = data.score ?? 0;
        document.getElementById('scoreCircle').textContent = score;
        document.getElementById('scoreCircle').style.background = gradeColor(score);
        document.getElementById('gradeText').textContent = `Grade: ${data.grade || '--'}`;
        document.getElementById('summaryText').textContent = data.summary || '';
        const fillList = (id, items) => {
          const ul = document.getElementById(id);
          ul.innerHTML = '';
          (items || []).forEach((item) => {
            const li = document.createElement('li');
            li.textContent = item;
            ul.appendChild(li);
          });
        };
        fillList('strengthsList', data.strengths);
        fillList('weaknessesList', data.weaknesses);
        fillList('recommendationsList', data.recommendations);
        result.classList.add('visible');
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        loading.style.display = 'none';
        stopLoadingText();
      }
    });
  </script>
</body>
</html>
