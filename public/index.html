<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AuraChat — AI SEO / AEO Analyzer</title>

  <!-- Favicon (SVG for modern browsers) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Favicon (PNG fallbacks for legacy browsers) -->
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <!-- Apple touch icon (iOS home screen, 180x180) -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- Safari pinned tab / macOS touch bar -->
  <link rel="mask-icon" href="/favicon.svg" color="#38bdf8" />

  <!-- PWA manifest (Android home screen, installable web app) -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Theme color (mobile browser UI, Android status bar) -->
  <meta name="theme-color" content="#0f172a" />

  <!-- iOS web app capable (standalone mode when added to home screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AuraChat" />

  <!-- Mobile web app capable (Android/Chrome) -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Open Graph (social sharing) -->
  <meta property="og:title" content="AuraChat — AI SEO / AEO Analyzer" />
  <meta property="og:description" content="Get a personalized report on how optimized your site is for AI-driven discovery." />
  <meta property="og:image" content="/icon-512.png" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AuraChat — AI SEO / AEO Analyzer" />
  <meta name="twitter:description" content="Get a personalized report on how optimized your site is for AI-driven discovery." />
  <meta name="twitter:image" content="/icon-512.png" />

  <!-- Poppins font (for the aurachat wordmark SVG) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-display: swap;
      font-weight: 100 900;
      src: url('/fonts/geist-latin-wght-normal.woff2') format('woff2-variations');
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-display: swap;
      font-weight: 100 900;
      src: url('/fonts/geist-latin-ext-wght-normal.woff2') format('woff2-variations');
      unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
    }
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #4ade80;
      --warn: #facc15;
      --danger: #f87171;
    }
    * { box-sizing: border-box; } html { -webkit-text-size-adjust: 100%; touch-action: manipulation; -ms-touch-action: manipulation; } body { touch-action: manipulation; -ms-touch-action: manipulation; overscroll-behavior: none; } @media (hover: none) and (pointer: coarse) { body { -webkit-touch-callout: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; } input, button { user-select: text; -webkit-user-select: text; } }
    body {
      margin: 0;
      font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 800px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .brand-name {
      height: 52px;
      width: auto;
      flex-shrink: 0;
    }
    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { padding: 20px; }
      .logo { width: 36px; height: 36px; }
      .brand-name { height: 42px; }
      h1 { font-size: 12px; }
      .score { width: 80px; height: 80px; font-size: 28px; }
      .grade { font-size: 18px; }
    }
    form {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    input[type="url"] {
      flex: 1;
      min-width: 240px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    input[type="url"]:focus {
      border-color: var(--accent);
    }
    button {
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .result {
      margin-top: 24px;
      display: none;
    }
    .result.visible {
      display: block;
    }
    .score-row {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .score {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      color: #0f172a;
    }
    .grade {
      font-size: 22px;
      font-weight: 700;
    }
    .summary {
      color: var(--muted);
      margin-top: 4px;
    }
    .lists {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .list {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
    }
    .list h3 {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .list ul {
      margin: 0;
      padding-left: 18px;
    }
    .list li {
      margin-bottom: 8px;
      line-height: 1.45;
    }
    .strengths li { color: #bbf7d0; }
    .weaknesses li { color: #fecaca; }
    .recommendations li { color: #e2e8f0; }
    .error {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(248,113,113,0.15);
      color: var(--danger);
      display: none;
    }
    .loading {
      margin-top: 16px;
      color: var(--muted);
      display: none;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--muted);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .loading-text {
      display: inline-block;
      animation: fadeIn 0.4s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="brand">
          <img src="/favicon.svg" alt="AuraChat logo" class="logo" />
          <svg class="brand-name" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" role="img" aria-label="aurachat"><defs><linearGradient id="dotGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8ee3ff"/><stop offset="100%" stop-color="#6457ff"/></linearGradient><filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur"/></filter></defs><g transform="translate(40 130)"><text style="font-family:'Poppins',sans-serif;font-size:72px;font-weight:600;fill:#fff;letter-spacing:-2.5px">aurachat</text><circle cx="342" cy="-12" r="12" fill="url(#dotGradient)" filter="url(#glowEffect)"/></g></svg>
        </div>
        <h1>AI SEO / AEO Analyzer</h1>
      </div>
      <p class="subtitle">Get a personalized report on how optimized your site is for AI-driven discovery.</p>
      <form id="analyzeForm">
        <input type="url" id="urlInput" placeholder="https://example.com" required />
        <button type="submit" id="submitBtn">Analyze</button>
      </form>
      <div class="loading" id="loading">
        <span class="spinner"></span><span class="loading-text" id="loadingText">Analyzing your page...</span>
      </div>
      <div class="error" id="error"></div>
      <div class="result" id="result">
        <div class="score-row">
          <div class="score" id="scoreCircle">--</div>
          <div>
            <div class="grade" id="gradeText">--</div>
            <div class="summary" id="summaryText"></div>
          </div>
        </div>
        <div class="lists">
          <div class="list strengths">
            <h3>Strengths</h3>
            <ul id="strengthsList"></ul>
          </div>
          <div class="list weaknesses">
            <h3>Weaknesses</h3>
            <ul id="weaknessesList"></ul>
          </div>
          <div class="list recommendations">
            <h3>Recommendations</h3>
            <ul id="recommendationsList"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
  // Prevent pinch-to-zoom and gesture-based zooming on mobile/touch devices only.
  // This is a fallback for browsers (e.g., iOS 10+ Safari) that ignore
  // user-scalable=no in the viewport meta tag for accessibility reasons.
  (function () {
    var isTouch = window.matchMedia("(hover: none) and (pointer: coarse)").matches
      || ("ontouchstart" in window)
      || (navigator.maxTouchPoints > 0);
    if (!isTouch) return;

    // Block iOS Safari proprietary gesture events (pinch/rotate)
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (evt) {
      document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
    });

    // Block multi-touch move events (pinch-to-zoom on Android/Chrome)
    document.addEventListener("touchmove", function (e) {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // Block double-tap-to-zoom by neutralizing rapid consecutive taps
    var lastTouchEnd = 0;
    document.addEventListener("touchend", function (e) {
      var now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
  })();

    const form = document.getElementById('analyzeForm');
    const urlInput = document.getElementById('urlInput');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const errorEl = document.getElementById('error');
    const result = document.getElementById('result');

    const FUN_LOADING_TEXTS = [
      'Analyzing your page...',
      'Scanning meta tags for secrets...',
      'Counting headings like a librarian...',
      'Hunting for structured data...',
      'Checking if AI can find you...',
      'Measuring your AEO readiness...',
      'Asking the AI gods for wisdom...',
      'Decoding your Open Graph...',
      'Looking for FAQ gold...',
      'Evaluating conversational vibes...',
      'Searching for schema.org treasures...',
      'Polishing the crystal ball...',
      'Consulting the SEO oracle...',
      'Reading between the lines of your HTML...',
      'Checking if ChatGPT would recommend you...',
      'Seeing how Perplexity perceives you...',
      'Whispering to the search algorithms...',
      'Inspecting your JSON-LD for magic...',
      'Counting words like they matter...',
      'Gauging your AI-friendliness index...',
    ];

    let loadingInterval = null;
    let loadingIndex = 0;

    function startLoadingText() {
      loadingIndex = 0;
      loadingText.textContent = FUN_LOADING_TEXTS[0];
      loadingInterval = setInterval(() => {
        loadingIndex = (loadingIndex + 1) % FUN_LOADING_TEXTS.length;
        loadingText.textContent = FUN_LOADING_TEXTS[loadingIndex];
        // Restart the fade animation
        loadingText.classList.remove('loading-text');
        void loadingText.offsetWidth;
        loadingText.classList.add('loading-text');
      }, 2200);
    }

    function stopLoadingText() {
      if (loadingInterval) {
        clearInterval(loadingInterval);
        loadingInterval = null;
      }
    }

    function gradeColor(score) {
      if (score >= 85) return 'var(--success)';
      if (score >= 70) return '#38bdf8';
      if (score >= 55) return 'var(--warn)';
      if (score >= 40) return '#fb923c';
      return 'var(--danger)';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();
      if (!url) return;
      submitBtn.disabled = true;
      loading.style.display = 'block';
      startLoadingText();
      errorEl.style.display = 'none';
      result.classList.remove('visible');
      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        if (data.error) throw new Error(data.error);
        const score = data.score ?? 0;
        document.getElementById('scoreCircle').textContent = score;
        document.getElementById('scoreCircle').style.background = gradeColor(score);
        document.getElementById('gradeText').textContent = `Grade: ${data.grade || '--'}`;
        document.getElementById('summaryText').textContent = data.summary || '';
        const fillList = (id, items) => {
          const ul = document.getElementById(id);
          ul.innerHTML = '';
          (items || []).forEach((item) => {
            const li = document.createElement('li');
            li.textContent = item;
            ul.appendChild(li);
          });
        };
        fillList('strengthsList', data.strengths);
        fillList('weaknessesList', data.weaknesses);
        fillList('recommendationsList', data.recommendations);
        result.classList.add('visible');
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        loading.style.display = 'none';
        stopLoadingText();
      }
    });
  </script>
</body>
</html>
