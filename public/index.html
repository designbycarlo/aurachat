<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraChat - AI Agent</title>
  <style>
    /* ───── Reset & Base ───── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ───── Header ───── */
    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    header .logo {
      font-size: 28px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header .subtitle {
      font-size: 13px;
      color: #888;
      margin-left: auto;
    }

    header .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #4ade80;
    }

    header .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ───── Chat Container ───── */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      scroll-behavior: smooth;
    }

    #chat-container::-webkit-scrollbar {
      width: 6px;
    }

    #chat-container::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat-container::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    /* ───── Messages ───── */
    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message.assistant {
      flex-direction: row;
    }

    .message .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .message.user .avatar {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
    }

    .message.assistant .avatar {
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
    }

    .message .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 14px;
      word-wrap: break-word;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: #1e1e32;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom-left-radius: 4px;
    }

    .message .bubble p {
      margin-bottom: 8px;
    }

    .message .bubble p:last-child {
      margin-bottom: 0;
    }

    .message .bubble code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .message .bubble pre {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
    }

    .message .bubble pre code {
      background: none;
      padding: 0;
    }

    /* ───── Tool Usage Cards ───── */
    .tool-card {
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 10px;
      padding: 10px 14px;
      margin: 8px 0;
      font-size: 13px;
    }

    .tool-card .tool-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a78bfa;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .tool-card .tool-result {
      color: #94a3b8;
      font-size: 12px;
    }

    /* ───── Streaming / Thinking ───── */
    .streaming-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .streaming-indicator .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a78bfa;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .streaming-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
    .streaming-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    .thinking-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin: 4px 0;
    }

    /* ───── Input Area ───── */
    #input-container {
      padding: 16px 24px;
      background: #0f0f1a;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    #input-wrapper {
      display: flex;
      gap: 10px;
      max-width: 800px;
      margin: 0 auto;
      background: #1a1a2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 4px;
    }

    #input-wrapper:focus-within {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.15);
    }

    #message-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #e0e0e0;
      font-size: 14px;
      padding: 10px 14px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
    }

    #message-input::placeholder {
      color: #555;
    }

    #send-btn {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
      flex-shrink: 0;
      align-self: flex-end;
    }

    #send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ───── Error Messages ───── */
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin: 8px 0;
    }

    /* ───── Empty State ───── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #555;
      text-align: center;
      padding: 40px;
    }

    #empty-state .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    #empty-state h2 {
      font-size: 22px;
      color: #888;
      margin-bottom: 8px;
    }

    #empty-state p {
      font-size: 14px;
      max-width: 400px;
      line-height: 1.6;
    }

    #empty-state .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
      justify-content: center;
    }

    #empty-state .suggestion-chip {
      background: #1a1a2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    #empty-state .suggestion-chip:hover {
      background: #2a2a4e;
      border-color: rgba(139, 92, 246, 0.3);
      color: #a78bfa;
    }

    /* ───── Responsive ───── */
    @media (max-width: 640px) {
      header .subtitle { display: none; }
      #chat-container { padding: 12px 16px; }
      #input-container { padding: 12px 16px; }
      .message .bubble { max-width: 85%; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <span class="logo">🤖</span>
    <h1>AuraChat</h1>
    <span class="subtitle">powered by OpenRouter</span>
    <div class="status">
      <span class="status-dot"></span>
      <span>Connected</span>
    </div>
  </header>

  <!-- Chat Messages -->
  <div id="chat-container">
    <div id="empty-state">
      <div class="icon">🤖</div>
      <h2>AuraChat AI Agent</h2>
      <p>
        I'm an AI assistant powered by OpenRouter's free models. Ask me about the weather,
        perform calculations, check the time, or just chat!
      </p>
      <div class="suggestions">
        <div class="suggestion-chip" onclick="sendSuggestion('What\'s the weather in New York?')">🌤️ Weather in New York</div>
        <div class="suggestion-chip" onclick="sendSuggestion('What is 25 * 48 + 12?')">🔢 Calculate 25×48+12</div>
        <div class="suggestion-chip" onclick="sendSuggestion('What time is it in Tokyo?')">⏰ Time in Tokyo</div>
        <div class="suggestion-chip" onclick="sendSuggestion('What\'s the weather in London and Paris?')">🌍 Weather in London & Paris</div>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div id="input-container">
    <div id="input-wrapper">
      <textarea
        id="message-input"
        placeholder="Ask me anything..."
        rows="1"
        onkeydown="handleKeyDown(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()" disabled>
        ➤
      </button>
    </div>
  </div>

  <script>
    // ───── State ─────
    let messages = [];
    let isStreaming = false;
    let currentAssistantMessage = null;
    let currentToolCard = null;

    // ───── DOM References ─────
    const chatContainer = document.getElementById('chat-container');
    const emptyState = document.getElementById('empty-state');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    // ───── Auto-resize textarea ─────
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
      sendBtn.disabled = !textarea.value.trim() || isStreaming;
    }

    // ───── Key handlers ─────
    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    // ───── Send suggestion chip ─────
    function sendSuggestion(text) {
      messageInput.value = text;
      sendBtn.disabled = false;
      sendMessage();
    }

    // ───── Send message ─────
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || isStreaming) return;

      messageInput.value = '';
      messageInput.style.height = 'auto';
      sendBtn.disabled = true;

      // Add user message to UI
      addUserMessage(text);
      messages.push({ role: 'user', content: text });

      // Hide empty state
      emptyState.style.display = 'none';

      // Show assistant message placeholder
      currentAssistantMessage = addAssistantMessagePlaceholder();

      isStreaming = true;

      try {
        await streamResponse(messages);
      } catch (error) {
        console.error('Stream error:', error);
        if (currentAssistantMessage) {
          const bubble = currentAssistantMessage.querySelector('.bubble');
          bubble.innerHTML = `<div class="error-message">⚠️ Error: ${error.message || 'Failed to connect to the server. Make sure the server is running.'}</div>`;
        }
      } finally {
        isStreaming = false;
        sendBtn.disabled = !messageInput.value.trim();
        currentAssistantMessage = null;
        currentToolCard = null;
      }
    }

    // ───── Stream Response ─────
    async function streamResponse(messages) {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages }),
      });

      if (!response.ok) {
        const error = await response.json().catch(() => ({ error: 'Request failed' }));
        throw new Error(error.error || `HTTP ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        // Parse SSE events
        const lines = buffer.split('\n');
        buffer = lines.pop() || ''; // Keep incomplete line in buffer

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            try {
              const data = JSON.parse(line.slice(6));
              handleSSEData(data);
            } catch (e) {
              // Skip invalid JSON
            }
          }
        }
      }

      // Process remaining buffer
      if (buffer.startsWith('data: ')) {
        try {
          const data = JSON.parse(buffer.slice(6));
          handleSSEData(data);
        } catch (e) {}
      }
    }

    // ───── Handle SSE Data ─────
    function handleSSEData(data) {
      if (!currentAssistantMessage) return;

      const bubble = currentAssistantMessage.querySelector('.bubble');

      switch (data.type) {
        case 'text-delta': {
          // Remove thinking indicator if present
          const thinking = bubble.querySelector('.thinking-badge');
          if (thinking) thinking.remove();

          // Append text
          const textSpan = bubble.querySelector('.assistant-text');
          if (textSpan) {
            textSpan.textContent += data.textDelta || '';
          } else {
            bubble.innerHTML = `<span class="assistant-text">${data.textDelta || ''}</span>`;
          }
          break;
        }

        case 'tool-call-begin': {
          const toolCall = data.toolCall || {};
          const toolName = toolCall.toolName || 'unknown';
          const args = toolCall.args ? JSON.stringify(toolCall.args, null, 2) : '';

          // Create tool card
          const toolCard = document.createElement('div');
          toolCard.className = 'tool-card';
          toolCard.innerHTML = `
            <div class="tool-header">
              🔧 ${toolName}
              <span class="streaming-indicator">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
              </span>
            </div>
            <div class="tool-result">Executing...</div>
          `;
          bubble.appendChild(toolCard);
          currentToolCard = toolCard;
          break;
        }

        case 'tool-call-delta': {
          // Update tool card args if needed
          break;
        }

        case 'tool-result': {
          if (currentToolCard) {
            const toolResult = data.toolResult || {};
            const resultStr = typeof toolResult.result === 'object'
              ? JSON.stringify(toolResult.result, null, 2)
              : String(toolResult.result || '');

            currentToolCard.querySelector('.streaming-indicator')?.remove();
            currentToolCard.querySelector('.tool-result').textContent = `✅ Complete`;
          }
          break;
        }

        case 'finish': {
          const finishData = data;
          if (finishData.usage) {
            const usage = finishData.usage;
            // Add a small usage footer
            const footer = document.createElement('div');
            footer.style.cssText = 'font-size: 11px; color: #666; margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.05);';
            footer.textContent = `⚡ ${usage.promptTokens || '?'} in / ${usage.completionTokens || '?'} out`;
            bubble.appendChild(footer);
          }
          break;
        }

        case 'error': {
          const errorMsg = data.error || 'An error occurred';
          bubble.innerHTML = `<div class="error-message">⚠️ ${errorMsg}</div>`;
          break;
        }
      }

      // Auto-scroll
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // ───── Add User Message ─────
    function addUserMessage(text) {
      const div = document.createElement('div');
      div.className = 'message user';
      div.innerHTML = `
        <div class="avatar">👤</div>
        <div class="bubble">${escapeHtml(text)}</div>
      `;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // ───── Add Assistant Placeholder ─────
    function addAssistantMessagePlaceholder() {
      const div = document.createElement('div');
      div.className = 'message assistant';
      div.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="bubble">
          <div class="thinking-badge">
            <span class="streaming-indicator">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </span>
            Thinking
          </div>
        </div>
      `;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    // ───── Escape HTML ─────
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ───── Initial focus ─────
    messageInput.focus();
  </script>
</body>
</html>
