name = "aurachat"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# D1 database binding (serverless SQLite, free on Pages).
# The binding name `DB` is referenced from functions/_lib/db.js as `env.DB`.
[[d1_databases]]
binding = "DB"
database_name = "aurachat"
database_id = "977986ba-c669-4462-9287-7cc634432e3c"
migrations_dir = "migrations"

# Secrets (e.g. OPENROUTER_API_KEY) are set on the Pages project via
# Settings → Environment variables (tick Encrypt). Never commit them.
# OPENROUTER_API_KEY is read at runtime from env.
