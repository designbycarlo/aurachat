name = "aurachat"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# D1 database binding (serverless SQLite, free on Pages).
# The binding name `DB` is referenced from functions/_lib/db.js as `env.DB`.
[[d1_databases]]
binding = "DB"
database_name = "aurachat"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

# Secrets are set with `wrangler secret put OPENROUTER_API_KEY` (never commit them).
# OPENROUTER_API_KEY is read at runtime from env.
