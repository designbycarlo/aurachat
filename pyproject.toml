[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aurachat"
version = "0.1.0"
description = "LightAgent Framework - Development Preview"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "LightAgent>=0.9.6",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[tool.setuptools]
py-modules = ["demo_preview"]
